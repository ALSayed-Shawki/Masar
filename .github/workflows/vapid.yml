name: Create push notification keys (run once)

# Running this again replaces the keys, and every phone has to turn
# notifications on again from Settings. Run it only for first setup.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to create new keys"
        required: true

jobs:
  vapid:
    if: ${{ github.event.inputs.confirm == 'YES' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate and store keys (private key never printed)
        run: |
          npx --yes web-push@3.6.7 generate-vapid-keys --json > keys.json
          PUB=$(node -e "console.log(require('./keys.json').publicKey)")
          PRIV=$(node -e "console.log(require('./keys.json').privateKey)")
          echo "::add-mask::$PRIV"
          supabase secrets set "VAPID_PUBLIC_KEY=$PUB" "VAPID_PRIVATE_KEY=$PRIV" --project-ref "$PROJECT_REF"
          rm keys.json
