name: Deploy database and functions to Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Apply database migrations
        run: |
          set +e
          supabase db push -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee push.log
          code=${PIPESTATUS[0]}
          # surface the real error in the run summary (annotations), not just "exit code 1"
          if [ "$code" -ne 0 ]; then grep -iE "error|failed|ERROR:" push.log | head -5 | while read -r l; do echo "::error title=Migration::$l"; done; fi
          exit $code
      - name: Set function secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          args=()
          if [ -n "$ANTHROPIC_API_KEY" ]; then args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"); else echo "::warning::ANTHROPIC_API_KEY is empty"; fi
          CRON_SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')"
          if [ -n "$CRON_SECRET" ]; then args+=("CRON_SECRET=$CRON_SECRET"); else echo "::warning::CRON_SECRET is empty"; fi
          [ ${#args[@]} -eq 0 ] && exit 0
          supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF" 2>&1 | tee secrets.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then tail -5 secrets.log | while read -r l; do echo "::error title=Secrets::$l"; done; fi
          exit $code
      - name: Deploy edge functions
        run: |
          set +e
          fail=0
          for f in ai push-config reminders mcp; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api 2>&1 | tee "fn-$f.log"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then fail=1; tail -5 "fn-$f.log" | while read -r l; do echo "::error title=Function $f::$l"; done; fi
          done
          exit $fail
      - name: Schedule reminders (every 5 minutes)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          CRON_SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')"; export CRON_SECRET
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET is empty, reminders not scheduled"; exit 0; fi
          # The secret goes into Supabase Vault; the cron job reads it from there, so it never sits in the job text.
          python3 - > q.json <<'PY'
          import json, os
          s = os.environ["CRON_SECRET"].replace("'", "''")
          ref = os.environ["PROJECT_REF"]
          q = f"""
          create extension if not exists pg_cron with schema pg_catalog;
          create extension if not exists pg_net with schema extensions;
          do $$ declare sid uuid; begin
            select id into sid from vault.secrets where name = 'masar_cron_secret';
            if sid is null then perform vault.create_secret('{s}', 'masar_cron_secret');
            else perform vault.update_secret(sid, '{s}'); end if;
          end $$;
          select cron.unschedule(jobid) from cron.job where jobname = 'masar-reminders';
          select cron.schedule('masar-reminders', '*/5 * * * *', $job$
            select net.http_post(
              url := 'https://{ref}.supabase.co/functions/v1/reminders',
              headers := jsonb_build_object('Content-Type', 'application/json'),
              body := jsonb_build_object('secret', (select decrypted_secret from vault.decrypted_secrets where name = 'masar_cron_secret')),
              timeout_milliseconds := 30000);
          $job$);
          """
          print(json.dumps({"query": q}))
          PY
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @q.json)
          rm -f q.json
          if [ "${code:0:1}" != "2" ]; then echo "::error title=Cron::HTTP $code $(head -c 400 resp.json)"; exit 1; fi
          # one manual run to prove the function accepts the secret
          for n in 1 2 3 4; do
            r=$(curl -sS -w ' HTTP %{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/reminders" -H "Content-Type: application/json" -d "{\"secret\":\"$CRON_SECRET\"}")
            case "$r" in *"HTTP 200"*) break;; esac; sleep 15
          done
          echo "reminders test: $r"
          case "$r" in *"HTTP 200"*) ;; *)
            # compare fingerprints only (never the value) to see which side differs
            echo "::notice title=Fingerprint local::$(printf '%s' "$CRON_SECRET" | sha256sum | cut -c1-12) len=${#CRON_SECRET}"
            echo "::notice title=Fingerprint server::$(supabase secrets list --project-ref "$PROJECT_REF" 2>&1 | grep -i CRON_SECRET | tr -s ' ' | cut -c1-80)";;
          esac
          echo "::notice title=Reminders::$r"
          case "$r" in *"HTTP 200"*) ;; *) echo "::error title=Reminders::$r"; exit 1;; esac
