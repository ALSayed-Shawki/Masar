name: Deploy database and functions to Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Apply database migrations
        run: |
          set +e
          supabase db push -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee push.log
          code=${PIPESTATUS[0]}
          # surface the real error in the run summary (annotations), not just "exit code 1"
          if [ "$code" -ne 0 ]; then grep -iE "error|failed|ERROR:" push.log | head -5 | while read -r l; do echo "::error title=Migration::$l"; done; fi
          exit $code
      - name: Set function secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          args=()
          if [ -n "$ANTHROPIC_API_KEY" ]; then args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"); else echo "::warning::ANTHROPIC_API_KEY is empty"; fi
          if [ -n "$CRON_SECRET" ]; then args+=("CRON_SECRET=$CRON_SECRET"); else echo "::warning::CRON_SECRET is empty"; fi
          [ ${#args[@]} -eq 0 ] && exit 0
          supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF" 2>&1 | tee secrets.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then tail -5 secrets.log | while read -r l; do echo "::error title=Secrets::$l"; done; fi
          exit $code
      - name: Deploy edge functions
        run: |
          set +e
          fail=0
          for f in ai push-config med-reminders; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api 2>&1 | tee "fn-$f.log"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then fail=1; tail -5 "fn-$f.log" | while read -r l; do echo "::error title=Function $f::$l"; done; fi
          done
          exit $fail
